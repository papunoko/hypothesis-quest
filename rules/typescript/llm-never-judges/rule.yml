# 不可侵ルール（README「Jevの役割」/ concept.md §5）: 生成 LLM は語るだけで、判定しない。
#
# 事例の結果は実行済みの固定データ、予想と照合はコード、仮説の読み取りは Jev。
# LLM の出力が verdict / cleared / prediction / 次の事例 に流れ込んだ瞬間に
# 「AI が反例を捏造しない」「AI に採点されない」が崩れる。型検査では見えない
# （文字列が文字列のまま分岐に使われるだけ）ので、ここで見る。
#
# 対象: 関数すべて（過剰一致で良い。LLM を呼ばない関数は低い値で沈む）。
# state は located: 関数が呼ぶ callModel / generateText が LLM かどうかは
# 同じファイルを見ないと分からない。

id: llm-never-judges
languages: [TypeScript, Tsx]
kind: noul
subject: node
state: located
# uncalibrated
at: 0.60
severity: warning
rule:
  any:
    - all:
        - kind: function_declaration
        - has: { field: name, pattern: $NAME }
    - all:
        - kind: method_definition
        - has: { field: name, pattern: $NAME }
    - all:
        - kind: variable_declarator
        - has: { field: name, pattern: $NAME }
        - has:
            any:
              - kind: arrow_function
              - kind: function_expression
ask: >-
  This function ($NAME) lets text generated by a language model decide a
  game outcome: whether a prediction matched, a verdict, a score, whether the
  player cleared, which case is shown next, or what the software actually did.
criteria:
  "true": >-
    The body parses, matches, or branches on the content of a model-generated
    string (a PASS/FAIL token, a case id, a remembered/computed answer, a
    number) and the result becomes a verdict, a prediction, a cleared flag, a
    selection of the next case, or a stored fact about behaviour; or it
    compares the model's text with recorded outcomes to produce match /
    mismatch.
  "false": >-
    Model-generated text is only returned or displayed as prose, stored as a
    narration or explanation beside facts computed elsewhere, screened by a
    separate judgment for leaks and then shown or replaced by a fallback, or
    discarded on error; every verdict, prediction and case selection comes
    from fixed data and code. A function that does not involve a language
    model at all is also false.
note: >-
  Choosing between the generated text and a fixed fallback text is
  presentation, not a game outcome. A screening step that asks a separate
  judgment model whether the generated text leaks facts, and hides it if so,
  is the intended design and is false. The defect is the generated content
  itself becoming the answer. Read the helpers in the same file to tell which
  calls reach a language model.
